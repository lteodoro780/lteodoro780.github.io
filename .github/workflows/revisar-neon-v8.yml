name: Revisar L0 NOC V8 Neon Datacenter sem publicar

on:
  push:
    branches:
      - v8-neon-datacenter-concept-20261015
    paths:
      - '.github/workflows/revisar-neon-v8.yml'
      - 'frontend/src/**'
      - 'frontend/tests/**'
      - 'frontend/scripts/validate-build.mjs'
      - 'frontend/src/App.css'
  workflow_dispatch:

concurrency:
  group: l0-noc-v8-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validar-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Build e verificacoes
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          python3 scripts/validate-static.py
          yarn install --frozen-lockfile --non-interactive
          yarn build
          node scripts/validate-build.mjs
      - name: Validar desktop e celular no Playwright
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --prefix ../.qa --no-save --no-package-lock playwright@1.55.0
          ../.qa/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build > /tmp/l0noc-v8-server.log 2>&1 &
          NODE_PATH="$GITHUB_WORKSPACE/.qa/node_modules" node tests/react-build-smoke.cjs
      - name: Guardar capturas visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0noc-v8-neon-datacenter-screenshots
          path: frontend/artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preparar build compilado apenas na branch V8
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/build/index.html
          test -f frontend/build/bastidores.html
          test -f frontend/build/img/registro/lab-debian.webp
          rm -rf static
          cp -a frontend/build/. .
          BUNDLE="$(find static/js -maxdepth 1 -type f -name 'main.*.js' | head -1)"
          test -n "$BUNDLE"
          node --check "$BUNDLE"
          test "$(find img/registro -maxdepth 1 -name '*.webp' | wc -l)" -eq 20
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .qa frontend/artifacts
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build(portfolio): preparar V8 Neon Datacenter para Pages"
            # O checkout pode ter ficado desatualizado enquanto outros commits
            # foram enviados à branch. Atualizar sem descartar mudanças.
            for attempt in 1 2 3; do
              git fetch origin v8-neon-datacenter-concept-20261015
              git rebase origin/v8-neon-datacenter-concept-20261015
              if git push origin HEAD:refs/heads/v8-neon-datacenter-concept-20261015; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Falha ao publicar build na branch de revisão após 3 tentativas."
                exit 1
              fi
            done
          fi
      - name: Resumo
        run: |
          echo "### L0 NOC V8 — revisão sem publicação" >> "$GITHUB_STEP_SUMMARY"
          echo "O site público continua na V7 durante a revisão." >> "$GITHUB_STEP_SUMMARY"
