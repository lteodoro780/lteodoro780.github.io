name: Validar Telemetria V5 sem publicar

on:
  push:
    branches:
      - telemetria-evidencias-20261014
    paths:
      - '.github/workflows/telemetria-v5-review.yml'
      - 'frontend/tests/react-build-smoke.cjs'
      - 'frontend/src/components/os/apps/Telemetria.jsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar-e-preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Validar React e páginas estáticas
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          python3 scripts/validate-static.py
          yarn install --frozen-lockfile --non-interactive
          yarn build
          node scripts/validate-build.mjs
      - name: Executar testes mobile e desktop
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --prefix ../.qa --no-save --no-package-lock playwright@1.55.0
          ../.qa/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build > /tmp/l0noc-v5-server.log 2>&1 &
          NODE_PATH="$GITHUB_WORKSPACE/.qa/node_modules" node tests/react-build-smoke.cjs
      - name: Guardar capturas para análise
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0noc-v5-telemetria-capturas
          path: frontend/artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preparar build somente na branch de revisão
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/build/index.html
          test -f frontend/build/bastidores.html
          test -f frontend/build/img/registro/lab-debian.webp
          rm -rf static
          cp -a frontend/build/. .
          BUNDLE="$(find static/js -maxdepth 1 -type f -name 'main.*.js' | head -1)"
          test -n "$BUNDLE"
          node --check "$BUNDLE"
          test "$(find img/registro -maxdepth 1 -name '*.webp' | wc -l)" -eq 20
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .qa frontend/artifacts
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "build(portfolio): preparar telemetria documental V5 para Pages"
            git push origin HEAD:refs/heads/telemetria-evidencias-20261014
          fi
      - name: Resumo
        run: |
          echo "### V5: apenas branch de revisão" >> "$GITHUB_STEP_SUMMARY"
          echo "A main não foi modificada." >> "$GITHUB_STEP_SUMMARY"
