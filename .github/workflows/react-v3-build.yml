name: React V3 - validacao sem publicacao

on:
  push:
    branches:
      - v3-react-fotos-integracao-20261014
    paths:
      - 'frontend/**'
      - '.github/workflows/react-v3-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-react:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build e smoke tests (somente se frontend presente)
        run: |
          set -euo pipefail
          if [ ! -f frontend/package.json ] || [ ! -f frontend/yarn.lock ]; then
            echo "Aguardando envio de frontend/ pelo Bazzite. Nada publicado."
            exit 0
          fi
          cd frontend
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          python3 scripts/validate-static.py
          yarn install --frozen-lockfile --non-interactive
          CI=true yarn build
          node scripts/validate-build.mjs
          npm install --prefix ../.qa --no-save --no-package-lock playwright@1.55.0
          ../.qa/node_modules/.bin/playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build > /tmp/l0noc-react.log 2>&1 &
          NODE_PATH="$GITHUB_WORKSPACE/.qa/node_modules" node tests/react-build-smoke.cjs
      - name: Capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l0noc-v3-fotos-screenshots
          path: frontend/artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build sem publicar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: l0noc-v3-react-build-nao-publicado
          path: frontend/build/
          if-no-files-found: ignore
          retention-days: 7
