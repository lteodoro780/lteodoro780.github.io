<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#0A0D14"/><meta name="description" content="L0·NOC — portfólio de Luis O. Florencio: infraestrutura Linux/Windows Server, redes, observabilidade, automação e projetos técnicos."/><link rel="icon" type="image/svg+xml" href="./favicon.svg"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/><title>L0·NOC — Luis O. Florencio</title><script defer="defer" src="./static/js/main.e0a73799.js"></script><link href="./static/css/main.926e784b.css" rel="stylesheet"><meta name="author" content="Luis O. Florencio"/><meta property="og:title" content="Luis O. Florencio | Infraestrutura e Automação"/><meta property="og:description" content="Portfólio de infraestrutura de TI, redes, automação e projetos de software."/><meta property="og:type" content="website"/><style id="l0-personalizacao-v2">
/* L0·NOC — acabamento visual da versão definitiva */
.topology-central-host {
  position: absolute;
  left: 50%;
  top: 10%;
  width: min(55vw, 640px);
  height: 60%;
  transform: translateX(-50%);
  z-index: 1;
  pointer-events: auto;
}
.topology-central-host [data-testid="hero-layer-stack"] > div {
  width: clamp(220px, 21vw, 320px);
  height: clamp(220px, 21vw, 320px);
  will-change: transform;
}
/* Foto real dentro da janela Sobre */
.about-photo-banner {
  position: relative;
  width: 100%;
  height: 238px;
  margin: 0 0 22px;
  overflow: hidden;
  border: 1px solid #334155;
  background: #0a0d14;
  display: flex;
  justify-content: center;
  align-items: center;
}
.about-photo-banner img {
  display: block;
  position: relative;
  z-index: 1;
  width: auto;
  max-width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  filter: saturate(.9) contrast(1.04);
}
.about-photo-banner::before {
  content: "";
  position: absolute;
  inset: -14px;
  background: url("./img/luis-florencio.webp") center 31% / cover no-repeat;
  filter: blur(17px) brightness(.33) saturate(.6);
  transform: scale(1.08);
}
.about-photo-banner::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to top, rgba(10,13,20,.48), transparent 58%), linear-gradient(to right,rgba(10,13,20,.12),transparent 50%);
  box-shadow: inset 0 0 0 1px rgba(16,185,129,.2);
}
/* Quatro capas no conteúdo real dos serviços. */
.project-cover {
  display: block;
  margin-top: 18px;
  overflow: hidden;
  text-decoration: none;
  border: 1px solid #334155;
  background: #0a0d14;
}
.project-cover:focus-visible {outline: 2px solid #10b981;outline-offset: 3px;}
.project-cover-inner {height: clamp(158px, 22vw, 246px);position: relative;overflow: hidden;}
.project-cover img {
  width: 100%;height: 100%;display: block;object-fit: cover;
  transition: transform .65s cubic-bezier(.22,1,.36,1), filter .65s ease;
  transform: scale(1.005);
}
.project-cover:hover img,.project-cover:focus-visible img {transform: scale(1.045);filter: saturate(1.12);}
.project-cover-tag {
  position: absolute;left: 10px;bottom: 10px;
  border: 1px solid rgba(16,185,129,.4);
  background: rgba(10,13,20,.82);
  padding: 5px 9px;
  font: 10px "JetBrains Mono", monospace;
  letter-spacing: .14em;color: #6ee7b7;
  backdrop-filter: blur(6px);
}
[data-testid^="project-repo-"][href=""],
[data-testid^="project-demo-"][href=""],
[data-testid^="project-repo-"]:not([href]),
[data-testid^="project-demo-"]:not([href]) { display: none !important; }
@media (max-width: 767px) {
  .topology-central-host {top: 29%; width: 100%;height: 42%;opacity:.76;}
  .topology-central-host [data-testid="hero-layer-stack"] > div {width: 210px;height: 210px;}
  .about-photo-banner {height: 210px;}
  .project-cover-inner {height: 170px;}
}
@media (prefers-reduced-motion: reduce) {
  .project-cover img { transition: none; }
}
</style></head><body><noscript>Ative o JavaScript para ver este site.</noscript><div id="root"></div></body></html>
